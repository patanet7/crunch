[package]
name = "crunch"
version = "0.1.0"
edition = "2021"
description = "Privacy-respecting, mise-aware output compression proxy for AI coding assistants"
license = "Apache-2.0"
readme = "README.md"
keywords = ["cli", "llm", "token", "filter", "mise"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
ignore = "0.4"
walkdir = "2"
regex = "1"
lazy_static = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
colored = "2"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
chrono = "0.4"
thiserror = "1.0"
tempfile = "3"
sha2 = "0.10"
flate2 = "1.0"
quick-xml = "0.37"
which = "8"

[build-dependencies]
toml = "0.8"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

